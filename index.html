<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Swarithmetic</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />

    <!-- CSS with cache buster -->
    <link rel="stylesheet" href="style.css?v=2.0" />
  </head>

  <body data-theme="plus">
    <!-- PAGE HEADER -->
    <header class="page-header">
      <span class="page-title">SWARITHMETIC</span>
      <span class="page-sub">sing to solve</span>
    </header>

    <div class="page">
      <!-- MAIN CALCULATOR -->
      <section class="console" id="console">
        <div class="console-row">
          <!-- OPERAND 1 -->
          <div class="field">
            <input
              type="number"
              id="num1"
              class="operand-input"
              placeholder="4"
              min="0"
              max="999"
            />
            <label for="num1">operand 1</label>
          </div>

          <!-- OPERATOR -->
          <div class="field">
            <button id="opButton" class="op-button" type="button">+</button>
            <label>operator</label>
          </div>

          <!-- OPERAND 2 -->
          <div class="field">
            <input
              type="number"
              id="num2"
              class="operand-input"
              placeholder="6"
              min="0"
              max="999"
            />
            <label for="num2">operand 2</label>
          </div>
        </div>

        <!-- CALCULATE BUTTON -->
        <button id="calculateButton" class="calculate-button" type="button">
          CALCULATE ▶
        </button>

        <!-- ERROR MESSAGE -->
        <p id="errorMessage" class="error-text"></p>
      </section>

      <!-- GAME SECTION -->
      <section id="game" class="game" hidden>
        <!-- LEVEL -->
        <div id="level" class="level-badge">LEVEL 1 / 3</div>

        <!-- SOUND METER -->
        <div class="meter-track">
          <div id="targetLine" class="target-line"></div>
          <div id="meterFill" class="meter-fill"></div>
        </div>
        <p class="meter-caption">sound level</p>

        <!-- SWARA CONTAINER -->
        <div id="stage" class="stage">
          <div class="mic-hint">Tap the swara and sing</div>
          <button id="swaraButton" class="swara-circle" type="button">
            SA
          </button>
          <div id="stepLabel" class="step-label">target: 25%</div>
        </div>

        <!-- GAME CANVAS & PITCH SCALE -->
        <div class="game-container hidden" id="gameCanvasContainer">
          <div class="pitch-bar-container">
            <span class="swara-label">GA</span>
            <span class="swara-label">RI</span>
            <span class="swara-label">SA</span>
            <div id="pitchIndicator" class="pitch-indicator"></div>
          </div>

          <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="500" height="350"></canvas>
            <button id="startFlightBtn" class="main-btn" type="button">
              START FLIGHT
            </button>
          </div>
        </div>

        <!-- EQUATION & RESULTS -->
        <p id="equation" class="equation-line"></p>
        <p id="answer" class="answer-line"></p>

        <!-- EQUATION UNLOCK CARD -->
        <div id="equationCard" class="equation-card hidden">
          <p id="exprDisplay" class="expression-display"></p>
          <div class="input-group">
            <input type="number" id="userResultInput" placeholder="Result" />
            <button id="submitResultBtn" class="action-btn" type="button">
              SUBMIT
            </button>
          </div>
        </div>

        <!-- RESET -->
        <button id="resetButton" class="reset-button" type="button" hidden>
          sing again ↗
        </button>
      </section>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
