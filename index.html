<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Swarithmetic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body data-theme="plus">
    <header class="page-header">
      <span class="page-title">SWARITHMETIC</span>
      <span class="page-sub">sing to solve</span>
    </header>

    <div class="page">
      <!-- ===== Calculator ===== -->
      <section class="console" id="console">
        <div class="console-row">
          <div class="field">
            <input
              type="number"
              id="num1"
              class="operand-input"
              placeholder="4"
              min="0"
              max="999"
            />
            <label>operand 1</label>
          </div>

          <div class="field">
            <button id="opButton" class="op-button" type="button">+</button>
            <label>operator</label>
          </div>

          <div class="field">
            <input
              type="number"
              id="num2"
              class="operand-input"
              placeholder="6"
              min="0"
              max="999"
            />
            <label>operand 2</label>
          </div>
        </div>

        <button id="calculateButton" class="calculate-button" type="button">
          CALCULATE &#9654;
        </button>
        <p id="errorMessage" class="error-text"></p>
      </section>

      <!-- ===== Game + Live Pitch Area ===== -->
      <div id="game" class="game-area" hidden>
        <section class="game">
          <div id="level" class="level-badge">STEP 1 / 3</div>

          <div class="meter-track">
            <div id="targetLine" class="target-line"></div>
            <div id="meterFill" class="meter-fill"></div>
          </div>
          <p class="meter-caption">how close you are</p>

          <div id="stage" class="stage">
            <div class="mic-hint">
              Tap the swara, then sing and hold the note
            </div>
            <button id="swaraButton" class="swara-circle" type="button">
              SA
            </button>
            <div id="stepLabel" class="step-label">target: ~262 Hz</div>
          </div>

          <p id="equation" class="equation-line"></p>
          <p id="answer" class="answer-line"></p>

          <button id="resetButton" class="reset-button" type="button" hidden>
            sing again &#8599;
          </button>
        </section>

        <!-- ===== Side Pitch Meter ===== -->
        <aside class="side-meter">
          <p class="side-meter-title">live pitch</p>
          <div class="side-meter-track">
            <div id="sideMeterTarget" class="side-meter-target"></div>
            <div id="sideMeterFill" class="side-meter-fill"></div>
          </div>
          <p class="side-meter-readout">
            <span id="pitchReadout">-- Hz</span>
            <span id="targetReadout" class="side-meter-sub"></span>
          </p>
          <p
            id="holdReadout"
            class="side-meter-sub"
            style="text-align: center; margin-top: 8px"
          ></p>
        </aside>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
